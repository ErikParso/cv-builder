# Build configuration. Everything here is safe to tweak.

output:
  dir: out
  # Tokens: {name} {date} {year} {month} {day} {variant}
  # {name} is the profile name, spaces -> underscores.
  filename: "{name}_CV_{date}"

page:
  format: A4
  margin: { top: 9mm, right: 13mm, bottom: 9mm, left: 13mm }

theme:
  # Webfonts are fetched by Chrome at build time, so a build needs network access the
  # first time. If the fetch fails the fallback stacks below still render a clean CV -
  # it just looks like a system document rather than a designed one.
  fontImport: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
  displayFont: "'Source Serif 4', Georgia, 'Times New Roman', serif"   # name only

  accent: "#1f4d7a"      # headings, rules, link colour
  text: "#1a1a1a"
  muted: "#5a5f66"
  fontStack: "'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
  baseFontSize: "9.35pt"
  lineHeight: 1.38

# Section order. Remove or reorder freely; unknown names are ignored.
sections:
  - summary
  - experience
  - skills
  - education
  - languages

experience:
  # Roles ending before this render compactly (summary + tech, no bullets).
  # Set to null to disable.
  compactBefore: 2019-01
  # Hide the per-project breakdown for compact roles.
  showProjectsWhenCompact: false
