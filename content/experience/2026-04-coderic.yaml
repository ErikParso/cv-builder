# Erik asked (2026-09-16) for this to say plainly that Coderic is his own company:
# interviewers kept asking. Earlier drafts deliberately hid that; do not revert.
summary: >-
  My own software company, run full-time. The products below are my own ideas, taken
  from concept and architecture through to deployment.

# Each project: what it does and one engineering point. The stack is merged into the
# role-level `tech` line below, same as every other role.
projects:
  - name: mui-tanstack-table
    description: >-
      Open-source component library (MIT, published to npm) pairing MUI rendering
      components with TanStack Table, so the consumer keeps table state and logic and
      gets the UI for free.

  - name: EVE Copilot
    description: >-
      Live market analysis and route optimiser for an online game. Holds ~1.5M live
      market orders in memory, kept fresh by a crawler tuned around the source API's
      rate limits, and ranks trading and hauling opportunities on a single score. Ships
      with a voice companion on a locally hosted language model.

  - name: jobswipe
    description: >-
      CV-driven job matching for the Slovak and Czech market. A background worker crawls
      four job boards within their rate limits, and a cheap keyword filter runs first so
      only strong matches reach the LLM, which scores each one against the user's CV.
      In development.

tech: [TypeScript, Node.js, Express, React, MUI, Jotai, TanStack Query, TanStack Table,
       Vite, PostgreSQL, Ollama, Kokoro TTS, Storybook, Cypress, Vitest, Playwright,
       Docker, GitHub Actions, Google Sign-In]
