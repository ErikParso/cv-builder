role: Software Architect & Software Developer
company: SIGP Systems
client: Skoda Auto                 # rendered as "SIGP Systems - client: Skoda Auto"
location: Zilina, Slovakia
start: 2019-09
end: 2026-04
# Synot Games (2025-01 -> 2025-06) ran in parallel, part-time, and says so on its own
