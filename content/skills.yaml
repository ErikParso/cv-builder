# Group names are kept to one word where possible: the label column is narrow, and a
# wrapped label costs a line and makes the row harder to scan.
#
# Deliberately NOT here, though they remain visible in the older roles' tech lines:
#   VB.NET, WinForms, WPF, Roslyn, Angular Material, Refit, Google Maps API.
#   A skills section should read as what you want to be hired for, not everything
#   you have ever touched. Same reason Enzyme, Cordova, Xamarin and "Azure (basics)"
#   came off the original CV.

groups:
